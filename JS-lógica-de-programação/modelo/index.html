<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <link rel="stylesheet" href="./tabelaIMC/css/style.css" />
    <title>Tabela IMC</title>
  </head>
  <body>
    <section class="container">
      <h1>Tabela IMC</h1>
      <div class="colunas">
        <div class="coluna">
          <p><strong>IMC</strong></p>
          <p>Menor que 18,5</p>
          <p>Entre 18,5 e 24,9</p>
          <p>Entre 25 e 29,9</p>
          <p>Entre 30 e 34,9</p>
          <p>Entre 35 e 39,9</p>
          <p>Maior que 40</p>
        </div>
        <div class="coluna">
          <p><strong>Resultado</strong></p>
          <p>Abaixo do peso</p>
          <p>Peso normal</p>
          <p>Sobrepeso</p>
          <p>Obesidade grau 1</p>
          <p>Obesidade grau 2</p>
          <p>Obesidade grau 3</p>
        </div>
      </div>

      <h2>Calcule seu IMC</h2>
      <form action="">
        <label for="peso">
          Peso:
          <input
            type="number"
            id="peso"
            class="peso"
            min="15"
            max="350"
            step="0.1"
            placeholder="valor em kg"
          />
        </label>
        <label for="altura">
          Altura:
          <input
            type="number"
            id="altura"
            class="altura"
            min="1"
            max="250"
            step="0.01"
            placeholder="valor em m"
          />
        </label>

        <button type="button" class="botao">Calcular</button>
      </form>
      <div type="text" class="resultado" role="status" aria-live="polite"></div>
    </section>

    <script src="./tabelaIMC/js/main.js"></script>
  </body>
</html>
