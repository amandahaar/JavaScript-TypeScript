<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <link rel="stylesheet" href="./tabelaIMC/css/style.css" />
    <title>Modelo</title>
  </head>
  <body>
    <section class="container">
      <h1>Tabela IMC</h1>
      <div class="colunas">
        <div class="coluna">
          <p><strong>IMC</strong></p>
          <p>Menor que 18,5</p>
          <p>Entre 18,5 e 24,9</p>
          <p>Entre 25 e 29,9</p>
          <p>Entre 30 e 34,9</p>
          <p>Entre 35 e 39,9</p>
          <p>Maior que 40</p>
        </div>
        <div class="coluna">
          <p><strong>Resultado</strong></p>
          <p>Abaixo do peso</p>
          <p>Peso normal</p>
          <p>Sobrepeso</p>
          <p>Obesidade grau 1</p>
          <p>Obesidade grau 2</p>
          <p>Obesidade grau 3</p>
        </div>
      </div>

      <h1>Calcule seu IMC</h1>
      <form action="">
        <p>
          Peso:
          <input type="number" class="peso" placeholder="valor em kg" />
        </p>
        <p>
          Altura:
          <input type="number" class="altura" placeholder="valor em m" />
        </p>

        <button type="button" class="botao">Calcular</button>
      </form>
      <div type="text" class="resultado"></div>
    </section>

    <script src="./tabelaIMC/js/main.js"></script>
  </body>
</html>
